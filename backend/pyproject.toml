[project]
name = "stellar-pay-backend"
version = "0.1.0"
description = "Backend API for Stellar-to-Fiat Payment Bridge - Lithic Integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "lithic>=0.107.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
    "sqlmodel>=0.0.25",
    "stellar-sdk>=9.0.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
